version: "3.8"

services:
  web:
    build:
      context: .
    image: building-insulation-accounting:latest
    ports:
      - "5000:5000"
      - "8000:8000"
    environment:
      ACCOUNTING_DB: /data/accounting.db
      PORT: "5000"
    volumes:
      - accounting-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3); sys.exit(0 if r.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  accounting-data:
